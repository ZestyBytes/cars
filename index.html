<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#eef0e7">
<meta name="description" content="Car Spotter — a road book for spotting cars on a journey. Tap your specimen sheet, win the trip.">
<title>Car Spotter</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>

<!-- ───────────────────────── SETUP ───────────────────────── -->
<section id="screen-setup" class="screen is-active">
  <header class="topbar">
    <h1 class="logo">
      <button class="logo-btn" id="btn-theme" type="button" aria-label="Switch to the dark setting" title="Tap the title for the dark setting">car spotte<span>r</span><small>Road Book</small></button>
    </h1>
    <div class="topbar-actions">
      <button class="btn btn-ghost" id="btn-view-alltime" type="button">All-time</button>
    </div>
  </header>

  <div class="setup-scroll">
    <p class="hint">Who is playing, and which car are they looking for?</p>
    <h2 class="section-title">Players</h2>
    <div id="player-editor" class="player-editor"></div>
    <button class="btn btn-add" id="btn-add-player" type="button"><span class="plus">+</span> Add player</button>
  </div>

  <footer class="setup-footer">
    <button class="btn btn-danger-ghost" id="btn-reset-all" type="button">Reset all</button>
    <button class="btn btn-primary btn-start" id="btn-start" type="button">Begin journey</button>
  </footer>
</section>

<!-- ───────────────────────── GAME ───────────────────────── -->
<section id="screen-game" class="screen">
  <header class="gamebar">
    <div class="gamebar-left">
      <span class="trip-label">Journey No. <span id="trip-number">1</span></span>
      <span class="trip-timer" id="trip-timer">00:00</span>
    </div>
    <div class="gamebar-right">
      <button class="icon-btn" id="btn-sound" type="button" title="Sound" aria-label="Toggle sound">♪</button>
      <button class="btn btn-end" id="btn-end" type="button">End journey</button>
    </div>
  </header>
  <div class="play">
    <main id="board" class="board"></main>
    <aside class="standings" id="standings" aria-label="All-time standings">
      <h2 class="standings-title">All-time</h2>
      <ol class="standings-list" id="standings-list"></ol>
      <p class="standings-foot" id="standings-foot"></p>
    </aside>
  </div>
</section>

<!-- ───────────────────────── RESULTS ───────────────────────── -->
<section id="screen-results" class="screen">
  <canvas id="confetti" class="confetti"></canvas>
  <div class="results-inner">
    <div class="trophy" id="trophy" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 16h36v20a18 18 0 0 1-36 0z"/>
        <path d="M32 20H20a10 10 0 0 0 10 14M68 20h12a10 10 0 0 1-10 14"/>
        <path d="M50 54v14M36 74h28M30 84h40"/>
      </svg>
    </div>
    <p class="results-kicker" id="results-kicker">Journey complete</p>
    <h2 class="results-winner" id="results-winner">—</h2>
    <p class="results-sub" id="results-sub"></p>

    <div class="tabs" role="tablist">
      <button class="tab is-active" data-tab="trip" role="tab" type="button">This journey</button>
      <button class="tab" data-tab="all" role="tab" type="button">All-time</button>
      <button class="tab" data-tab="log" role="tab" type="button">Log</button>
    </div>
    <ol class="leaderboard" id="leaderboard"></ol>

    <div class="results-actions">
      <button class="btn btn-primary" id="btn-new-trip" type="button">New journey</button>
      <button class="btn btn-ghost" id="btn-edit-players" type="button">Edit players</button>
    </div>
  </div>
</section>

<!-- ───────────────────────── CONFIRM DIALOG ───────────────────────── -->
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title">Are you sure?</h3>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-cancel" type="button">Cancel</button>
      <button class="btn btn-danger" id="modal-ok" type="button">Confirm</button>
    </div>
  </div>
</div>

<script src="cars.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
